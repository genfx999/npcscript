<nav aria-label="Guide navigation">
  {% assign sections = "Start here,Authoring,Reference,Support" | split: "," %}
  {% for section in sections %}
    <p class="nav-title">{{ section }}</p>
    <ul>
      {% assign links = site.pages | where: "section", section | sort: "order" %}
      {% for link in links %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title | escape }}</a></li>
      {% endfor %}
    </ul>
  {% endfor %}
</nav>
